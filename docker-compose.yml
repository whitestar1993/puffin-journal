services:
  app:
    build: .
    image: puffin-journal:latest
    container_name: puffin-journal
    restart: unless-stopped
    env_file: .env
    # Runs as a non-root user. Match this to the owner of ./data on the host.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
    ports:
      # Behind a reverse proxy on the same host, bind to loopback only so the app
      # isn't reachable directly:   "127.0.0.1:${PORT:-8000}:8000"
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# Reverse proxy notes:
# - Terminate TLS at the proxy (Caddy, Traefik, nginx) and forward to this port.
#   Caddy example:   journal.example.com { reverse_proxy 127.0.0.1:8000 }
# - Set FORWARDED_ALLOW_IPS in .env to the proxy's IP (e.g. the Docker network
#   gateway, or "*" if only the proxy can reach the container) so the login rate
#   limit sees real client IPs instead of the proxy's.
# - COOKIE_SECURE=auto (default) marks the cookie HTTPS-only once the proxy is
#   trusted via FORWARDED_ALLOW_IPS; set it to true to enforce HTTPS-only.
